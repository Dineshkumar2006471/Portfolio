<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="100%" height="100%">
  <defs>
    <linearGradient id="green-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="m-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10B981" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Icon Crest -->
  <g transform="translate(15, 15)">
    <rect width="90" height="90" rx="22" fill="url(#green-grad)" filter="url(#m-shadow)" />
    <!-- Globe / Leaf / Infinity motif for sustainability & green skills -->
    <circle cx="45" cy="45" r="24" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-dasharray="8 4" />
    <!-- Leaf sprouting center -->
    <path d="M 34 54 C 34 40 45 32 56 32 C 56 46 48 56 34 54 Z" fill="#A7F3D0" />
    <path d="M 34 54 C 42 48 50 42 56 32" stroke="#047857" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Typography -->
  <g transform="translate(125, 52)">
    <text font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#0F172A" letter-spacing="1">
      1M<tspan fill="#10B981">1B</tspan>
    </text>
    <text x="0" y="28" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" fill="#64748B" letter-spacing="2.5">
      1 MILLION FOR 1 BILLION
    </text>
  </g>
</svg>
