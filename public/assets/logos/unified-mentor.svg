<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <linearGradient id="um-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4F46E5" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Icon Crest -->
  <g transform="translate(15, 15)">
    <rect width="90" height="90" rx="22" fill="url(#um-grad)" filter="url(#shadow)" />
    <!-- Stylized U + M interconnected knot -->
    <path d="M 28 30 L 28 52 C 28 62 36 68 45 68 C 54 68 62 62 62 52 L 62 30" 
          fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 45 50 L 45 68" 
          fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" />
    <circle cx="45" cy="32" r="5" fill="#FBBF24" />
  </g>

  <!-- Typography -->
  <g transform="translate(125, 52)">
    <text font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#1E1B4B" letter-spacing="1">
      UNIFIED
    </text>
    <text x="0" y="32" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="700" font-size="22" fill="#6366F1" letter-spacing="3.5">
      MENTOR
    </text>
    <text x="135" y="32" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" fill="#9CA3AF" letter-spacing="1.5">
      TECH
    </text>
  </g>
</svg>
