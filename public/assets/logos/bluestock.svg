<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bluestock-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052FF" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <filter id="b-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0052FF" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Icon Crest -->
  <g transform="translate(15, 15)">
    <rect width="90" height="90" rx="22" fill="url(#bluestock-grad)" filter="url(#b-shadow)" />
    <!-- Dynamic 'B' formed with financial growth bars -->
    <path d="M 28 26 L 28 64" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
    <!-- Upper bulb -->
    <path d="M 28 28 H 48 C 58 28 64 34 64 42 C 64 50 58 54 48 54 H 28" 
          fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Lower bulb + arrow upward -->
    <path d="M 28 54 H 52 C 62 54 68 60 68 68 C 68 76 62 82 52 82 H 28" 
          fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Accent spark -->
    <circle cx="56" cy="38" r="4.5" fill="#38BDF8" />
  </g>

  <!-- Typography -->
  <g transform="translate(125, 52)">
    <text font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#0A192F" letter-spacing="1">
      BLUESTOCK
    </text>
    <text x="0" y="30" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="16" fill="#0052FF" letter-spacing="4">
      FINTECH
    </text>
  </g>
</svg>
